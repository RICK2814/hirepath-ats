<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Animated HirePath robot mascot</title>
  <desc id="desc">A friendly compact robot with glowing teal eyes, a pulsing antenna, and a gently waving arm.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#b8c9e2"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#172b4c"/><stop offset="1" stop-color="#0b172c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70f7e5"/><stop offset="1" stop-color="#30aaca"/></linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .float{transform-origin:80px 85px;animation:float 3s ease-in-out infinite}
      .antenna{transform-origin:80px 35px;animation:antenna 1.5s ease-in-out infinite}
      .wave{transform-box:fill-box;transform-origin:16% 78%;animation:wave 1.2s ease-in-out infinite}
      .eye{animation:blink 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse{animation:pulse 1.7s ease-in-out infinite}
      .shine{animation:shine 2s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes antenna{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
      @keyframes wave{0%,100%{transform:rotate(0deg)}45%,70%{transform:rotate(-18deg)}}
      @keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
      @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes shine{0%,100%{opacity:.15}50%{opacity:.55}}
      @media(prefers-reduced-motion:reduce){.float,.antenna,.wave,.eye,.pulse,.shine{animation:none!important}}
    </style>
  </defs>
  <ellipse cx="80" cy="143" rx="42" ry="7" fill="#25c7bf" opacity=".14" class="shine"/>
  <g class="float">
    <!-- antenna -->
    <path d="M80 34V23" fill="none" stroke="#91a9c8" stroke-width="6" stroke-linecap="round"/>
    <g class="antenna"><circle cx="80" cy="19" r="8.5" fill="#12384a" stroke="url(#accent)" stroke-width="2"/><circle cx="80" cy="19" r="4.2" fill="#6ff6e5" filter="url(#softGlow)" class="pulse"/></g>
    <!-- left arm -->
    <path d="M43 82L29 93L22 84" fill="none" stroke="#91a9c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="83" r="8" fill="url(#shell)" stroke="#8ca6c8" stroke-width="2"/>
    <!-- waving arm -->
    <g class="wave">
      <path d="M117 78L130 63L137 51" fill="none" stroke="#91a9c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="139" cy="47" r="9" fill="url(#shell)" stroke="#8ca6c8" stroke-width="2"/>
      <path d="M137 40L136 33M143 40L146 34M146 46L153 44" stroke="#55dfd5" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
    <!-- body -->
    <rect x="43" y="91" width="74" height="42" rx="15" fill="url(#shell)" stroke="#8ca6c8" stroke-width="2"/>
    <rect x="56" y="101" width="48" height="22" rx="8" fill="url(#face)"/>
    <rect x="62" y="107" width="10" height="10" rx="3" fill="#5df0df" filter="url(#softGlow)" class="pulse"/>
    <rect x="88" y="107" width="10" height="10" rx="3" fill="#5df0df" filter="url(#softGlow)" class="pulse"/>
    <rect x="76" y="108" width="8" height="3" rx="1.5" fill="#829cb9" opacity=".8"/>
    <rect x="72" y="127" width="16" height="4" rx="2" fill="#7b91ae"/>
    <!-- head -->
    <rect x="34" y="34" width="92" height="69" rx="23" fill="url(#shell)" stroke="#8ca6c8" stroke-width="2.5"/>
    <rect x="42" y="43" width="76" height="51" rx="17" fill="url(#face)"/>
    <path d="M49 49Q59 44 69 48" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
    <g class="eye"><ellipse cx="62" cy="66" rx="7" ry="9" fill="#61f2df" filter="url(#softGlow)"/><circle cx="60" cy="63" r="2.2" fill="#fff"/></g>
    <g class="eye"><ellipse cx="98" cy="66" rx="7" ry="9" fill="#61f2df" filter="url(#softGlow)"/><circle cx="96" cy="63" r="2.2" fill="#fff"/></g>
    <path d="M69 81Q80 88 91 81" fill="none" stroke="#8aa8c8" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="40" cy="67" r="5" fill="url(#accent)"/>
    <circle cx="120" cy="67" r="5" fill="url(#accent)"/>
    <path d="M49 39Q80 27 110 39" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="2.6" stroke-linecap="round"/>
    <!-- tiny status light -->
    <circle cx="108" cy="48" r="2.7" fill="#6ff6c6" class="pulse"/>
  </g>
</svg>