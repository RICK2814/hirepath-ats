name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ats, POSTGRES_PASSWORD: ats, POSTGRES_DB: ats_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ats -d ats_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ats:ats@localhost:5432/ats_test
      TEST_DATABASE_URL: postgresql://ats:ats@localhost:5432/ats_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22", cache: npm }
      - run: npm install
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: nohup npm start > /tmp/hirepath.log 2>&1 &
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done; cat /tmp/hirepath.log; exit 1
      - run: npm run test:e2e
      - run: docker build -t hirepath .
