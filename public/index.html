<style>

</style></head><body>
<div id="root"></div><div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Candidate details"></aside>
<div class="pal card" id="pal" role="dialog" aria-label="Command palette"><input id="pq" placeholder="Search candidates or jump to…" aria-label="Command search"><ul id="pl"></ul></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
const ST=["Applied","Screening","Interview","Offer","Hired","Rejected"],SRC=["LinkedIn","Referral","Careers page","Agency","Job board"];
const SC=i=>`var(--s${i})`;
const IC={dash:'<path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-3H4z"/>',pipe:'<path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v5h-4z"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',jobs:'<path d="M3 8h18v11H3zM9 8V5h6v3"/>',out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',dl:'<path d="M12 4v11m-4-4l4 4 4-4M5 20h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',srch:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9m-4 4l3 3m-6-6l3 3"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const S={token:ls.get("ats_token"),user:null,view:"dashboard",jobs:[],stats:null,f:{q:"",stage:"",job:"",source:"",sort:"created",dir:"desc",page:1},D:null};
const rel=d=>{const s=(Date.now()-new Date(d))/1e3;if(s<3600)return Math.max(1,Math.round(s/60))+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";if(s<2592e3)return Math.round(s/86400)+"d ago";return new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})};
const avc=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 45% 42%)`};
const av=(n,sz)=>`<span class="av" style="background:${avc(n)};${sz?`width:${sz}px;height:${sz}px;font-size:${sz/3}px`:""}">${esc(n.split(" ").map(w=>w[0]).slice(0,2).join(""))}</span>`;
const stars=(n,on)=>`<span class="stars" aria-label="${n} of 5">${[1,2,3,4,5].map(i=>on?`<button data-rate="${i}" style="background:none;border:0;padding:0 1px;color:${i<=n?"var(--amb)":"var(--line)"};font-size:20px" aria-label="${i} stars">★</button>`:i<=n?"★":"<s>★</s>").join("")}</span>`;
const stagePill=s=>`<span class="pill"><i class="dot" style="background:${SC(ST.indexOf(s))};margin:0 6px 0 0"></i>${s}</span>`;
const mb=s=>s==null?'<span class="mut">–</span>':`<span class="pill" style="color:${s>=75?"var(--s4)":s>=50?"var(--s3)":"var(--s5)"}">${s}</span>`;
function toast(msg,undo){const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(msg)}</span>`;if(undo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{undo();t.remove()};t.append(b)}$("#toasts").append(t);setTimeout(()=>t.remove(),5000)}
const CID=Math.random().toString(36).slice(2);
async function api(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",headers:{"Content-Type":"application/json","x-client":CID,...(S.token?{Authorization:"Bearer "+S.token}:{})},body:o.body&&JSON.stringify(o.body)});
if(r.status==401&&!p.startsWith("/auth")){logout(false);throw new Error("Session expired")}if(r.status==204)return null;
if(o.raw)return r;const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message)}};

/* ---------- auth: Clerk + backwards-compatible password fallback ---------- */
let authConfigCache = null, clerkInstance = null, clerkLoadPromise = null, clerkListenerBound = false;
let clerkExchangePromise = null, clerkFailedSessionId = null;
async function getAuthConfig() {
  if (!authConfigCache) authConfigCache = fetch("/api/auth/config", { cache: "no-store" })
    .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || "Could not load auth configuration"); return j; })
    .catch(() => ({ provider: "password", publishableKey: null, clerkPartiallyConfigured: false }));
  return authConfigCache;
}
function loadClerkScript(id, src, attrs={}) {
  const found = document.getElementById(id);
  if (found && found.dataset.loadState === "loaded") return Promise.resolve();
  if (found) return new Promise((resolve,reject) => {
    found.addEventListener("load",resolve,{once:true}); found.addEventListener("error",()=>reject(new Error("Clerk sign-in assets could not be loaded.")),{once:true});
  });
  return new Promise((resolve,reject) => {
    const s = document.createElement("script"); s.id=id; s.src=src; s.async=true; s.crossOrigin="anonymous";
    Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));
    s.onload=()=>{s.dataset.loadState="loaded";resolve()};
    s.onerror=()=>{s.remove();reject(new Error("Clerk sign-in assets could not be loaded. Check the Clerk publishable key and allowed domain."))};
    document.head.appendChild(s);
  });
}
async function loadClerk(publishableKey) {
  if (clerkLoadPromise) return clerkLoadPromise;
  clerkLoadPromise = (async()=>{
    const encoded = publishableKey.split("_")[2];
    if (!encoded) throw new Error("Clerk publishable key is invalid.");
    let domain;
    try { domain = atob(encoded).replace(/\$/,""); } catch { throw new Error("Could not read the Clerk frontend domain from the publishable key."); }
    if (!/^[a-z0-9.-]+$/i.test(domain)) throw new Error("Clerk frontend domain is invalid.");
    await loadClerkScript("clerk-ui-sdk", "https://" + domain + "/npm/@clerk/ui@1/dist/ui.browser.js");
    await loadClerkScript("clerk-js-sdk", "https://" + domain + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js", {"data-clerk-publishable-key":publishableKey});
    const clerk = window.Clerk;

function showClerkError(message, signedIn=false) {

async function exchangeClerkSession(clerk) {
  if (!clerk || !clerk.isSignedIn || !clerk.session) return false;
  const sid=clerk.session.id || clerk.user?.id || "current-session";
  if (clerkFailedSessionId===sid) return false;
  if (clerkExchangePromise) return clerkExchangePromise;
  clerkExchangePromise=(async()=>{
    const jwt=await clerk.session.getToken();
    if(!jwt)throw new Error("Clerk did not provide a session token. Please sign in again.");
    const response=await fetch("/api/auth/clerk",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+jwt},body:"{}"});
    const result=await response.json().catch(()=>({}));
    if(!response.ok){clerkFailedSessionId=sid;throw new Error(result.error||"Clerk sign-in could not be linked to a HirePath account.");}
    clerkFailedSessionId=null;S.token=result.token;S.user=result.user;ls.set("ats_token",result.token);
    // Normalize the post-auth landing page and immediately enter the HirePath dashboard.
    history.replaceState(null,"",location.pathname+location.search+"#/dashboard");
    await boot();return true;
  })();
  try{return await clerkExchangePromise}finally{clerkExchangePromise=null}
}
async function loginView(initialError="") {
  const config=await getAuthConfig();
  if(config.provider!=="clerk"||!config.publishableKey) return renderPasswordLogin(config,initialError);
  $("#root").innerHTML=`<div class="login clerk-mode"><div class="clerk-shell"><div class="clerk-header"><span class="logo" style="width:40px;height:40px;border-radius:12px;flex:none"><svg class="i" style="stroke:#fff;width:22px;height:22px" viewBox="0 0 24 24"><path d="M7 18V6m0 6h10m0-6v12"/></svg></span><div class="clerk-heading"><h1>HirePath ATS</h1><p>Sign in securely to continue to your workspace.</p></div></div><div id="clerk-sign-in" class="clerk-widget"></div><div class="clerk-footnote">Secure authentication powered by Clerk</div><div class="err" id="clerk-auth-error" role="alert">${esc(initialError)}</div><button class="btn" id="clerk-signout" type="button" style="display:none">Sign out of Clerk</button></div></div>`;
  try {
    const clerk=await loadClerk(config.publishableKey);
    if(!clerkListenerBound && typeof clerk.addListener==="function") {
      clerk.addListener(()=> {
        if(clerk.isSignedIn&&clerk.session&&!S.token) {
          exchangeClerkSession(clerk).catch(error=>showClerkError(error.message,true));
        } else if(!clerk.isSignedIn) clerkFailedSessionId=null;
      });
      clerkListenerBound=true;
    }
    if(clerk.isSignedIn&&clerk.session) {
      try { if(await exchangeClerkSession(clerk))return; }
      catch(error){showClerkError(error.message,true);return}
      if(clerkFailedSessionId) { showClerkError("Your Clerk identity is signed in, but this account is not approved for HirePath. Ask the administrator to approve the account in Clerk Dashboard.",true); return; }
    }
    const mount=$("#clerk-sign-in");
    if(mount) {
      const appHome = location.origin + "/";
      clerk.mountSignIn(mount, {
        // Keep both sign-in and sign-up flows on this app's embedded Clerk widget.
        signInUrl: appHome,
        signUpUrl: appHome,
        forceRedirectUrl: appHome,
        fallbackRedirectUrl: appHome,
        signInForceRedirectUrl: appHome,
        signInFallbackRedirectUrl: appHome,
        signUpForceRedirectUrl: appHome,
        signUpFallbackRedirectUrl: appHome,
        routing: "hash",
        withSignUp: true,
        oauthFlow: "redirect"
      });
    }
  } catch(error) { showClerkError(error.message,false); }
}
function logout(signOutClerk=true) {

    '</div></section>';
  document.body.append(overlay);
  overlay.addEventListener("click",e=>{if(e.target===overlay||e.target.closest("[data-close-job-details]"))closeJobDetails()});
  overlay.querySelector("[data-close-job-details]")?.focus();
}
/* ---------- jobs ---------- */
function jobsV(){$("#main").innerHTML=`<form class="card pad" id="jf" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:14px"><input class="in" id="jt" placeholder="Role title" required aria-label="Role title"><input class="in" id="jd" placeholder="Department" aria-label="Department"><input class="in" id="jl" placeholder="Location" aria-label="Location"><button class="btn pri">Add role</button><textarea class="in" id="jx" rows="2" style="grid-column:1/-1" placeholder="Job description: skills and responsibilities. Used for match scoring." aria-label="Description"></textarea></form>
<div class="jobs">${S.jobs.map(j=>`<div class="card job ${j.status}"><h3>${esc(j.title)}</h3><p class="mut" style="margin:4px 0 14px">${esc(j.department||"No department")} · ${esc(j.location||"No location")}</p>${j.description?`<p style="margin:-6px 0 14px;font-size:13px">${esc(j.description.slice(0,110))}${j.description.length>110?"…":""}</p>`:""}<div class="job-actions"><span class="pill">${j.applicants} applicant${j.applicants==1?"":"s"}</span><button type="button" class="pill job-status-btn" data-view-job="${j.id}" title="Click to view full job details" aria-label="View details for ${esc(j.title)}">${esc(j.status)}</button><button type="button" class="btn sm" data-view-job="${j.id}">View details</button><span style="flex:1"></span>
<button class="btn sm" data-jt="${j.id}" data-s="${j.status=="open"?"closed":"open"}">${j.status=="open"?"Close role":"Reopen role"}</button></div></div>`).join("")}</div>`;
$("#jf").onsubmit=guard(async e=>{e.preventDefault();await api("/jobs",{method:"POST",body:{title:$("#jt").value,department:$("#jd").value,location:$("#jl").value,description:$("#jx").value}});toast("Role added");refresh()})}

/* ---------- candidate drawer ---------- */
async function openCand(id){let c={name:"",email:"",phone:"",job_id:S.jobs.find(j=>j.status=="open")?.id||"",skills:"",source:"Careers page",rating:0,stage:"Applied",events:[]};
if(id)try{c=await api("/candidates/"+id)}catch(e){return toast(e.message)}S.D=c;drawDrawer();$("#drawer").classList.add("on");$("#scrim").classList.add("on");setTimeout(()=>$("#drawer input")?.focus(),250)}
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");S.D=null}
function drawDrawer(){const c=S.D,isNew=!c.id;
$("#drawer").innerHTML=`<div class="dh">${c.name?av(c.name,44):""}<div class="grow"><h2>${isNew?"New candidate":esc(c.name)}</h2><span class="mut">${isNew?"Add someone to your pipeline":esc(c.job_title||"No role assigned")}</span></div><button class="btn sm" data-close aria-label="Close">${ic("x")}</button></div>
<div class="db"><div class="lab">Stage</div><div class="steps">${ST.map((s,i)=>`<button data-stage="${s}" aria-pressed="${c.stage==s}" style="${c.stage==s?`background:${SC(i)}`:""}">${s}</button>`).join("")}</div>
<div class="lab">Rating</div>${stars(c.rating,1)}
<div class="lab">Details</div><div class="f2"><div class="w"><input class="in" id="dn" placeholder="Full name" value="${esc(c.name)}" aria-label="Name"></div><input class="in" id="de" type="email" placeholder="Email" value="${esc(c.email)}" aria-label="Email"><input class="in" id="dp" placeholder="Phone" value="${esc(c.phone)}" aria-label="Phone">
<select class="in" id="dj" aria-label="Role"><option value="">No role</option>${S.jobs.map(j=>`<option value="${j.id}" ${c.job_id==j.id?"selected":""}>${esc(j.title)}</option>`).join("")}</select><select class="in" id="ds" aria-label="Source">${SRC.map(x=>`<option ${c.source==x?"selected":""}>${x}</option>`).join("")}</select>
<div class="w"><input class="in" id="dk" placeholder="Skills, comma separated" value="${esc(c.skills)}" aria-label="Skills"></div></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" data-save>${isNew?"Add candidate":"Save changes"}</button>${!isNew&&S.user.role=="admin"?'<button class="btn" data-anon>Anonymise</button><button class="btn bad" data-del>Delete</button>':""}</div>
${isNew?"":`${resumeBlock(c)}${reviewBlock(c)}${emailBlock(c)}${interviewBlock(c)}<div class="lab" style="margin-top:26px">Add a note</div><div style="display:flex;gap:8px"><input class="in" id="nt" placeholder="Interview feedback, follow-ups…" aria-label="Note"><button class="btn" data-note>Add note</button></div>
<div class="lab" style="margin-top:22px">Timeline</div><ul class="tl">${c.events.map(e=>`<li style="--c:${e.stage?SC(ST.indexOf(e.stage)):"var(--mute)"}"><b>${e.type=="stage"?esc(e.stage):{email:"Email",scorecard:"Scorecard"}[e.type]||"Note"}</b> <span class="mut">· ${esc(e.user_name)} · ${rel(e.at)}</span>${e.type!="stage"?`<q>${esc(e.body)}</q>`:e.body?`<div class="mut">${esc(e.body)}</div>`:""}</li>`).join("")}</ul>`}</div>`}
const CR=["Technical","Communication","Problem solving","Culture add"],REC=[["strong_yes","Strong yes"],["yes","Yes"],["no","No"],["strong_no","Strong no"]],TPL=[["invite","Interview invite"],["followup","Application received"],["offer","Offer"],["rejection","Rejection"]];
function reviewBlock(c){const L=c.scorecards||[],mine=L.find(x=>x.user_id==S.user.id),avg=L.length?(L.reduce((a,x)=>a+x.overall,0)/L.length).toFixed(1):null;
return`<div class="lab" style="margin-top:26px">Interview scorecards</div>${L.length?`<p style="margin:0 0 10px"><b>${avg}</b> average · ${L.length} review${L.length>1?"s":""} · ${L.filter(x=>x.recommendation.includes("yes")).length} recommend</p>${L.map(x=>`<div class="card" style="padding:10px 12px;box-shadow:none;margin-bottom:8px"><b>${esc(x.user_name)}</b> <span class="pill">${REC.find(r=>r[0]==x.recommendation)[1]}</span> <span class="stars">${x.overall}★</span><div class="mut" style="font-size:12px;margin-top:4px">${CR.map(k=>`${k} ${x.scores[k]}`).join(" · ")}</div>${x.comment?`<div style="margin-top:6px">${esc(x.comment)}</div>`:""}</div>`).join("")}`:'<p class="mut" style="margin:0 0 8px">No reviews yet.</p>'}
<details ${mine?"":"open"}><summary class="btn sm" style="display:inline-flex">${mine?"Edit my review":"Add my review"}</summary><div class="f2" style="margin-top:10px">${CR.map(k=>`<label class="mut">${k}<select class="in sc" data-k="${k}">${[5,4,3,2,1].map(n=>`<option ${(mine?.scores[k]||3)==n?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}
<label class="mut w">Recommendation<select class="in" id="rc">${REC.map(r=>`<option value="${r[0]}" ${mine?.recommendation==r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></label><div class="w"><textarea class="in" id="rm" rows="2" placeholder="Evidence behind your scores" aria-label="Review comment">${esc(mine?.comment||"")}</textarea></div></div><button class="btn sm" data-review style="margin-top:8px">Save review</button></details>`}
function emailBlock(){return`<div class="lab" style="margin-top:26px">Email candidate</div><select class="in" id="et" style="width:auto" aria-label="Email template"><option value="">Choose a template…</option>${TPL.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("")}</select>
<div id="eb" style="display:none;margin-top:10px"><input class="in" id="es" aria-label="Subject"><textarea class="in" id="ex" rows="7" style="margin-top:8px" aria-label="Email body"></textarea><button class="btn sm pri" data-send style="margin-top:8px">Send email</button></div>`}
function resumeBlock(c){const m=c.match_json?JSON.parse(c.match_json):null,col=m&&(m.score>=75?"var(--s4)":m.score>=50?"var(--s3)":"var(--s5)");
return`<div class="lab" style="margin-top:26px">Resume</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${c.resume_name?`<button class="btn sm" data-dl>${ic("dl")}${esc(c.resume_name)}</button>`:'<span class="mut">No resume yet</span>'}<label class="btn sm">${c.resume_name?"Replace file":"Upload PDF or TXT"}<input type="file" id="rf" accept=".pdf,.txt,.md" hidden></label></div>
<div class="lab" style="margin-top:22px">Role match</div>${m?`<div class="card" style="padding:14px;box-shadow:none"><div style="display:flex;align-items:center;gap:12px"><span class="serif" style="font-size:42px;line-height:1">${m.score}</span><div class="bar" style="flex:1"><i style="width:${m.score}%;background:${col}"></i></div></div><p style="margin:10px 0 0">${esc(m.summary)}</p>${m.strengths?.length?`<div class="lab" style="margin:12px 0 4px">Strengths</div><div class="chips">${m.strengths.map(x=>`<span class="pill" style="color:var(--s4)">${esc(x)}</span>`).join("")}</div>`:""}${m.gaps?.length?`<div class="lab" style="margin:12px 0 4px">Gaps</div><div class="chips">${m.gaps.map(x=>`<span class="pill" style="color:var(--s5)">${esc(x)}</span>`).join("")}</div>`:""}<small class="mut" style="display:block;margin-top:12px">Scored by ${esc(m.engine)}. A signal to review, not a decision.</small></div>`:'<p class="mut" style="margin:0 0 8px">Not scored yet.</p>'}
<button class="btn sm" data-match style="margin-top:8px" ${c.job_id?"":"disabled"}>${m?"Re-score match":"Score match"}</button>${c.job_id?"":' <span class="mut">Save a role on this candidate first.</span>'}`}
function localDateTimeValue(value){if(!value)return"";const d=new Date(value);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function interviewBlock(c){const eligible=c.stage==="Interview";return `<div class="lab" style="margin-top:26px">Interview calendar</div>${eligible?`<div class="f2"><label class="mut w">Interview date and time<input class="in" id="intAt" type="datetime-local" value="${localDateTimeValue(c.interview_at)}" aria-label="Interview date and time"></label><label class="mut">Duration (minutes)<input class="in" id="intDur" type="number" min="15" max="240" step="15" value="${c.interview_duration_minutes||45}" aria-label="Interview duration in minutes"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn sm pri" data-schedule>Save interview time</button><button class="btn sm" data-calendar>Download calendar (.ics)</button></div><p class="mut" style="font-size:12px;margin:8px 0 0">${c.interview_at?`Scheduled for ${new Date(c.interview_at).toLocaleString()}`:"No interview time scheduled yet."} Leave the time blank to clear the schedule.</p>`:`<p class="mut" style="margin:0 0 8px">Move this candidate to the Interview stage to schedule a time.</p><button class="btn sm" data-calendar>Download interview calendar (.ics)</button>`}`}
const body=()=>({name:$("#dn").value,email:$("#de").value,phone:$("#dp").value,job_id:$("#dj").value||null,source:$("#ds").value,skills:$("#dk").value,rating:S.D.rating,stage:S.D.stage});
const saveCand=guard(async()=>{const c=S.D,r=c.id?await api("/candidates/"+c.id,{method:"PUT",body:body()}):await api("/candidates",{method:"POST",body:body()});toast(c.id?"Changes saved":"Candidate added");S.D=r;drawDrawer();refresh()});
$("#drawer").addEventListener("click",guard(async e=>{const c=S.D,t=e.target.closest("button");if(!t)return;
if(t.hasAttribute("data-close"))return closeDrawer();if(t.hasAttribute("data-save"))return saveCand();
if(t.dataset.stage){if(!c.id){c.stage=t.dataset.stage;const b=body();drawDrawer();$("#dn").value=b.name;$("#de").value=b.email;return}const r=await api("/candidates/"+c.id,{method:"PUT",body:{stage:t.dataset.stage}});S.D=r;drawDrawer();toast(`Moved to ${r.stage}`);return refresh()}
if(t.dataset.rate){c.rating=+t.dataset.rate;if(c.id){S.D=await api("/candidates/"+c.id,{method:"PUT",body:{rating:c.rating}});refresh()}drawDrawer();return}
if(t.hasAttribute("data-note")){const v=$("#nt").value;if(!v.trim())return;S.D=await api(`/candidates/${c.id}/notes`,{method:"POST",body:{body:v}});drawDrawer();return toast("Note added")}
if(t.hasAttribute("data-review")){const scores={};document.querySelectorAll("#drawer .sc").forEach(x=>scores[x.dataset.k]=+x.value);S.D=await api(`/candidates/${c.id}/scorecards`,{method:"POST",body:{scores,recommendation:$("#rc").value,comment:$("#rm").value}});drawDrawer();toast("Review saved");return refresh()}
if(t.hasAttribute("data-send")){if(!confirm(`Send this email to ${c.email}?`))return;const r=await api(`/candidates/${c.id}/email`,{method:"POST",body:{subject:$("#es").value,body:$("#ex").value}});S.D=r.candidate;drawDrawer();return toast(r.status=="sent"?"Email sent":"Email logged only. Configure a sending provider (Brevo, Gmail SMTP, Resend, or Plunk).")}
if(t.hasAttribute("data-dl")){const r=await api(`/candidates/${c.id}/resume`,{raw:1});if(!r.ok)throw new Error("Resume file not found");const u=URL.createObjectURL(await r.blob()),a=document.createElement("a");a.href=u;a.download=c.resume_name;a.click();URL.revokeObjectURL(u);return}
if(t.hasAttribute("data-schedule")){const field=$("#intAt").value,mins=Number($("#intDur").value||45);const payload={interview_at:field?new Date(field).toISOString():null,duration_minutes:mins};await api(`/candidates/${c.id}/interview`,{method:"PUT",body:payload});S.D=await api(`/candidates/${c.id}`);drawDrawer();toast(payload.interview_at?"Interview scheduled":"Interview schedule cleared");refresh();return}
if(t.hasAttribute("data-calendar")){const r=await fetch("/api/calendar.ics",{headers:{Authorization:"Bearer "+S.token}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||"Could not download calendar")};const u=URL.createObjectURL(await r.blob()),a=document.createElement("a");a.href=u;a.download="hirepath-interviews.ics";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
if(t.hasAttribute("data-match")){t.disabled=true;t.textContent="Scoring…";S.D=await api(`/candidates/${c.id}/match`,{method:"POST"});drawDrawer();toast("Match score "+JSON.parse(S.D.match_json).score);return refresh()}
if(t.hasAttribute("data-anon")&&confirm(`Anonymise ${c.name}? Name, contact details, resume, notes and emails are erased permanently. Stage history is kept for reports.`)){await api("/candidates/"+c.id+"/anonymise",{method:"POST"});closeDrawer();toast("Candidate anonymised");refresh()}
if(t.hasAttribute("data-del")&&confirm(`Delete ${c.name}? This removes their history and cannot be undone.`)){await api("/candidates/"+c.id,{method:"DELETE"});closeDrawer();toast("Candidate deleted");refresh()}}));
$("#drawer").addEventListener("change",guard(async e=>{if(e.target.id!="rf"||!e.target.files[0])return;const f=e.target.files[0];if(f.size>5e6)return toast("File too large. Max 5 MB.");
const r=await fetch(`/api/candidates/${S.D.id}/resume`,{method:"POST",headers:{Authorization:"Bearer "+S.token,"x-filename":encodeURIComponent(f.name)},body:f}),j=await r.json();if(!r.ok)throw new Error(j.error);S.D=j;drawDrawer();toast("Resume uploaded. Skills updated.");refresh()}));
$("#drawer").addEventListener("change",guard(async e=>{if(e.target.id!="et")return;const eb=$("#eb");if(!e.target.value)return eb.style.display="none";const d=await api(`/candidates/${S.D.id}/email-draft?template=${e.target.value}`);$("#es").value=d.subject;$("#ex").value=d.body;eb.style.display="block"}));
$("#scrim").onclick=()=>{closeDrawer();closePal()};

/* ---------- command palette ---------- */
let pItems=[],pSel=0,pT;
const cmds=()=>[["Go to Dashboard","#/dashboard"],["Go to Pipeline","#/pipeline"],["Go to Candidates","#/candidates"],["Go to Jobs","#/jobs"],["New candidate",()=>openCand(null)],["Toggle theme",()=>$("#theme").click()],["Sign out",logout]].map(([l,a])=>({l,a,k:"Command"}));
function openPal(){$("#pal").classList.add("on");$("#scrim").classList.add("on");$("#pq").value="";$("#pq").focus();pQuery("")}
function closePal(){$("#pal").classList.remove("on");if(!S.D)$("#scrim").classList.remove("on")}
async function pQuery(q){let items=cmds().filter(c=>c.l.toLowerCase().includes(q.toLowerCase()));
if(q.trim().length>1)try{const r=await api("/candidates?limit=6&q="+encodeURIComponent(q));items=r.items.map(c=>({l:c.name,k:c.stage+" · "+(c.job_title||"No role"),a:()=>openCand(c.id)})).concat(items)}catch(e){}
pItems=items;pSel=0;drawPal()}
function drawPal(){$("#pl").innerHTML=pItems.map((x,i)=>`<li data-i="${i}" aria-selected="${i==pSel}">${esc(x.l)}<small>${esc(x.k)}</small></li>`).join("")||'<li class="mut">No matches</li>'}
function runPal(i){const x=pItems[i];if(!x)return;closePal();typeof x.a=="string"?location.hash=x.a:x.a()}
$("#pq").oninput=e=>{clearTimeout(pT);pT=setTimeout(()=>pQuery(e.target.value),150)};
$("#pl").onclick=e=>{const l=e.target.closest("li[data-i]");if(l)runPal(+l.dataset.i)};
$("#pq").onkeydown=e=>{if(e.key=="ArrowDown"){pSel=Math.min(pSel+1,pItems.length-1);drawPal();e.preventDefault()}else if(e.key=="ArrowUp"){pSel=Math.max(pSel-1,0);drawPal();e.preventDefault()}else if(e.key=="Enter")runPal(pSel)};

/* ---------- global events ---------- */
document.addEventListener("keydown",e=>{if(!S.user)return;const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();openPal()}
else if(e.key=="Escape"){closePal();closeDrawer();closeJobDetails()}else if(e.key=="n"&&!typing&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openCand(null)}});
document.addEventListener("click",e=>{
const clearSem=e.target.closest("[data-clear-sem]");if(clearSem){const box=$("#sem-results");if(box){box.hidden=true;box.innerHTML=""}return}
const viewJob=e.target.closest("[data-view-job]");if(viewJob){openJobDetails(viewJob.dataset.viewJob);return}
if(e.target.closest("[data-close-job-details]")){closeJobDetails();return}
const th=e.target.closest("[data-sort]");if(th){const f=S.f;f.dir=f.sort==th.dataset.sort&&f.dir=="desc"?"asc":"desc";f.sort=th.dataset.sort;return cands()}
const pg=e.target.closest("[data-pg]");if(pg){S.f.page+=+pg.dataset.pg;return cands()}
const jt=e.target.closest("[data-jt]");if(jt)return guard(async()=>{await api("/jobs/"+jt.dataset.jt,{method:"PUT",body:{status:jt.dataset.s}});refresh()})();
const jb=e.target.closest("[data-job]");if(jb)S.f.job=jb.dataset.job;
if(e.target.closest("[data-rate]")&&!e.target.closest("#drawer")){const c=e.target.closest("[data-id]");if(c){e.stopPropagation()}return}
const o=e.target.closest("[data-open],.kc[data-id]");if(o)openCand(o.dataset.open||o.dataset.id)});
startAuthBootstrap();
</script></body></html>
