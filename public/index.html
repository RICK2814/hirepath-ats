function loadClerkScript(id, src, attrs={}) {
  const found = document.getElementById(id);
  if (found && found.dataset.loadState === "loaded") return Promise.resolve();
  if (found) return new Promise((resolve,reject) => {
    found.addEventListener("load",resolve,{once:true}); found.addEventListener("error",()=>reject(new Error("Clerk sign-in assets could not be loaded.")),{once:true});
  });
  return new Promise((resolve,reject) => {
    const s = document.createElement("script"); s.id=id; s.src=src; s.async=true; s.crossOrigin="anonymous";
    Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));
    s.onload=()=>{s.dataset.loadState="loaded";resolve()};
    s.onerror=()=>{s.remove();reject(new Error("Clerk sign-in assets could not be loaded. Check the Clerk publishable key and allowed domain."))};
    document.head.appendChild(s);
  });
}
async function loadClerk(publishableKey) {
  if (clerkLoadPromise) return clerkLoadPromise;
  clerkLoadPromise = (async()=>{
    const encoded = publishableKey.split("_")[2];
    if (!encoded) throw new Error("Clerk publishable key is invalid.");
    let domain;
    try { domain = atob(encoded).replace(/\$/,""); } catch { throw new Error("Could not read the Clerk frontend domain from the publishable key."); }
    if (!/^[a-z0-9.-]+$/i.test(domain)) throw new Error("Clerk frontend domain is invalid.");
    await loadClerkScript("clerk-ui-sdk", "https://" + domain + "/npm/@clerk/ui@1/dist/ui.browser.js");
    await loadClerkScript("clerk-js-sdk", "https://" + domain + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js", {"data-clerk-publishable-key":publishableKey});
    const clerk = window.Clerk;
    if (!clerk || typeof clerk.load !== "function") throw new Error("Clerk JavaScript SDK did not initialize.");
    await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
    clerkInstance = clerk;
    return clerk;
  })().catch(error=>{clerkLoadPromise=null;throw error});
  return clerkLoadPromise;
}

    event.preventDefault();

    if(!target)return;
    const opening=target.hidden;
    const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Keep one information panel open at a time so the page stays predictable.
    document.querySelectorAll(".login-info-panel").forEach(panel=>{
      if(panel!==target)panel.hidden=true;
    });

      const active=navButton===button&&opening;
      navButton.setAttribute("aria-expanded",String(active));

    });

    target.hidden=!opening;
    if(!opening){
      if(window.scrollY>0)window.scrollTo({top:0,behavior:reduced?"auto":"smooth"});
      return;
    }

    // Wait until the panel has entered layout before calculating its position;
    // this avoids the page moving under the smooth-scroll animation.
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const top=Math.max(0,window.scrollY+target.getBoundingClientRect().top-24);
        window.scrollTo({top,behavior:reduced?"auto":"smooth"});
        target.classList.remove("login-section-flash");
        void target.offsetWidth;

        window.setTimeout(()=>target.classList.remove("login-section-flash"),1350);
      });
    });
  }));

function showClerkError(message, signedIn=false) {
  const node=$("#clerk-auth-error"); if(node)node.textContent=message;

  if(button)button.onclick=async()=>{try{if(clerkInstance)await clerkInstance.signOut()}catch{};clerkFailedSessionId=null;S.token=null;S.user=null;ls.set("ats_token",null);loginView()};

async function exchangeClerkSession(clerk) {
  if (!clerk || !clerk.isSignedIn || !clerk.session) return false;
  const sid=clerk.session.id || clerk.user?.id || "current-session";
  if (clerkFailedSessionId===sid) return false;
  if (clerkExchangePromise) return clerkExchangePromise;
  clerkExchangePromise=(async()=>{
    const jwt=await clerk.session.getToken();
    if(!jwt)throw new Error("Clerk did not provide a session token. Please sign in again.");
    const response=await fetch("/api/auth/clerk",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+jwt},body:"{}"});
    const result=await response.json().catch(()=>({}));
    if(!response.ok){clerkFailedSessionId=sid;throw new Error(result.error||"Clerk sign-in could not be linked to a HirePath account.");}
    clerkFailedSessionId=null;S.token=result.token;S.user=result.user;ls.set("ats_token",result.token);
    // Normalize the post-auth landing page and immediately enter the HirePath dashboard.
    history.replaceState(null,"",location.pathname+location.search+"#/dashboard");
    await boot();return true;
  })();
  try{return await clerkExchangePromise}finally{clerkExchangePromise=null}
}
async function loginView(initialError="") {
  const config=await getAuthConfig();

  const auth=`<section class="login-auth-panel" aria-label="Sign in">
    <div class="login-auth-logo"><span class="login-brand-mark">${loginLogoSvg("clerk")}</span></div>

    <div class="login-security-note"><span class="login-security-shield">✓</span><span>Enterprise-grade authentication and security</span></div>
  </section>`;
  loginFrameMarkup(auth);
  try {
    const clerk=await loadClerk(config.publishableKey);
    if(!clerkListenerBound && typeof clerk.addListener==="function") {
      clerk.addListener(()=> {
        if(clerk.isSignedIn&&clerk.session&&!S.token) {
          exchangeClerkSession(clerk).catch(error=>showClerkError(error.message,true));
        } else if(!clerk.isSignedIn) clerkFailedSessionId=null;
      });
      clerkListenerBound=true;
    }
    if(clerk.isSignedIn&&clerk.session) {
      try { if(await exchangeClerkSession(clerk))return; }
      catch(error){showClerkError(error.message,true);return}
      if(clerkFailedSessionId) { showClerkError("Your Clerk identity is signed in, but this account is not approved for HirePath. Ask the administrator to approve the account in Clerk Dashboard.",true); return; }
    }
    const mount=$("#clerk-sign-in");
    if(mount) {
      const appHome = location.origin + "/";
      clerk.mountSignIn(mount, {
        signInUrl: appHome,
        signUpUrl: appHome,
        forceRedirectUrl: appHome,
        fallbackRedirectUrl: appHome,
        signInForceRedirectUrl: appHome,
        signInFallbackRedirectUrl: appHome,
        signUpForceRedirectUrl: appHome,
        signUpFallbackRedirectUrl: appHome,
        routing: "hash",
        withSignUp: true,
        oauthFlow: "redirect",
        appearance: {
          variables: {
            colorPrimary: "#795bff",
            colorText: "#f4f7ff",
            colorTextSecondary: "#9fb2cc",
            colorBackground: "#0b1021",
            colorInputBackground: "#090d1c",
            colorInputText: "#f4f7ff",
            colorNeutral: "#b2c4dc",
            borderRadius: "12px",
            fontFamily: "Inter, system-ui, sans-serif"
          }
        }
      });
    }
  } catch(error) { showClerkError(error.message,false); }
}

function closeJobDetails(){document.querySelector("#jobDetailOverlay")?.remove()}
function relativeTimeLabel(value){
  if(!value)return "Recently posted";
  const stamp=new Date(value).getTime();
  if(!Number.isFinite(stamp))return "Recently posted";
  const seconds=Math.max(0,(Date.now()-stamp)/1000);
  if(seconds<45)return "Just now";
  const rtf=new Intl.RelativeTimeFormat("en",{numeric:"always"});
  if(seconds<3600)return rtf.format(-Math.round(seconds/60),"minute");
  if(seconds<86400)return rtf.format(-Math.round(seconds/3600),"hour");
  if(seconds<2592000)return rtf.format(-Math.round(seconds/86400),"day");
  if(seconds<31536000)return rtf.format(-Math.round(seconds/2592000),"month");
  return rtf.format(-Math.round(seconds/31536000),"year");
}

$("#drawer").addEventListener("change",guard(async e=>{if(e.target.id!="et")return;const eb=$("#eb");if(!e.target.value)return eb.style.display="none";const d=await api(`/candidates/${S.D.id}/email-draft?template=${e.target.value}`);$("#es").value=d.subject;$("#ex").value=d.body;eb.style.display="block"}));
$("#scrim").onclick=()=>{closeDrawer();closePal()};

/* ---------- command palette ---------- */
let pItems=[],pSel=0,pT;
const cmds=()=>[["Go to Dashboard","#/dashboard"],["Go to Pipeline","#/pipeline"],["Go to Candidates","#/candidates"],["Go to Jobs","#/jobs"],["New candidate",()=>openCand(null)],["Toggle theme",()=>$("#theme").click()],["Sign out",logout]].map(([l,a])=>({l,a,k:"Command"}));
function openPal(){$("#pal").classList.add("on");$("#scrim").classList.add("on");$("#pq").value="";$("#pq").focus();pQuery("")}
function closePal(){$("#pal").classList.remove("on");if(!S.D)$("#scrim").classList.remove("on")}
async function pQuery(q){let items=cmds().filter(c=>c.l.toLowerCase().includes(q.toLowerCase()));
if(q.trim().length>1)try{const r=await api("/candidates?limit=6&q="+encodeURIComponent(q));items=r.items.map(c=>({l:c.name,k:c.stage+" · "+(c.job_title||"No role"),a:()=>openCand(c.id)})).concat(items)}catch(e){}
pItems=items;pSel=0;drawPal()}
function drawPal(){$("#pl").innerHTML=pItems.map((x,i)=>`<li data-i="${i}" aria-selected="${i==pSel}">${esc(x.l)}<small>${esc(x.k)}</small></li>`).join("")||'<li class="mut">No matches</li>'}
function runPal(i){const x=pItems[i];if(!x)return;closePal();typeof x.a=="string"?location.hash=x.a:x.a()}
$("#pq").oninput=e=>{clearTimeout(pT);pT=setTimeout(()=>pQuery(e.target.value),150)};
$("#pl").onclick=e=>{const l=e.target.closest("li[data-i]");if(l)runPal(+l.dataset.i)};
$("#pq").onkeydown=e=>{if(e.key=="ArrowDown"){pSel=Math.min(pSel+1,pItems.length-1);drawPal();e.preventDefault()}else if(e.key=="ArrowUp"){pSel=Math.max(pSel-1,0);drawPal();e.preventDefault()}else if(e.key=="Enter")runPal(pSel)};

/* ---------- global events ---------- */
document.addEventListener("keydown",e=>{if(!S.user)return;const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();openPal()}
else if(e.key=="Escape"){closePal();closeDrawer();closeJobDetails()}else if(e.key=="n"&&!typing&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openCand(null)}});
document.addEventListener("click",e=>{
const clearSem=e.target.closest("[data-clear-sem]");if(clearSem){const box=$("#sem-results");if(box){box.hidden=true;box.innerHTML=""}return}
const viewJob=e.target.closest("[data-view-job]");if(viewJob){openJobDetails(viewJob.dataset.viewJob);return}
if(e.target.closest("[data-close-job-details]")){closeJobDetails();return}
const th=e.target.closest("[data-sort]");if(th){const f=S.f;f.dir=f.sort==th.dataset.sort&&f.dir=="desc"?"asc":"desc";f.sort=th.dataset.sort;return cands()}
const pg=e.target.closest("[data-pg]");if(pg){S.f.page+=+pg.dataset.pg;return cands()}
const jt=e.target.closest("[data-jt]");if(jt)return guard(async()=>{await api("/jobs/"+jt.dataset.jt,{method:"PUT",body:{status:jt.dataset.s}});refresh()})();
const jb=e.target.closest("[data-job]");if(jb)S.f.job=jb.dataset.job;
if(e.target.closest("[data-rate]")&&!e.target.closest("#drawer")){const c=e.target.closest("[data-id]");if(c){e.stopPropagation()}return}
const o=e.target.closest("[data-open],.kc[data-id]");if(o)openCand(o.dataset.open||o.dataset.id)});
startAuthBootstrap();
</script></body></html>
